[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pif_eval"
version = "1.0.0"
description = "PIF evaluation CLI and metrics"
requires-python = ">=3.12"
dependencies = ["pif_core"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.20", "tokenizers>=0.21", "numpy>=2"]

[tool.setuptools.packages.find]
include = ["pif_eval*"]
